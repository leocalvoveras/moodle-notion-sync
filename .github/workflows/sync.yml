name: Sincronizar Moodle con Notion

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, al minuto 17
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      dry_run:
        description: "Simulación (no escribe nada en Notion)"
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar sincronización
        run: python sync_moodle_notion.py
        env:
          MOODLE_ICS_URL: ${{ secrets.MOODLE_ICS_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
